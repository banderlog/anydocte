[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anydocte"
version = "0.3.0"
description = "Universal anydoc+tesseract document extraction server"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "firecrawl-anydoc>=0.1.3",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "Pillow>=10.2.0",
    "pdf_inspector>=1.15.0",
    "python-magic>=0.4.27"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[project.scripts]
anydocte = "anydocte.cli:main"

[tool.setuptools.dynamic]
version = { attr = "anydocte.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]

# Strict only for the shipped package: src/ is strict-clean, so new untyped
# code there fails the check. Tests stay lenient on purpose (pytest fixtures
# and monkeypatched fakes would need ~54 annotations for no real benefit).
[[tool.mypy.overrides]]
module = ["anydocte", "anydocte.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["pytesseract", "pytesseract.*"]
ignore_missing_imports = true
